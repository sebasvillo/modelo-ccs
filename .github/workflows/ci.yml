name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python 3.13 and locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Tests (golden master included)
        run: uv run pytest -q --durations=5
