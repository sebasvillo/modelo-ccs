# Render Blueprint: free web service, rebuilt on every push to main.
services:
  - type: web
    name: modelo-ccs-api
    runtime: docker
    plan: free
    region: virginia
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: CCS_CORS_ORIGINS
        value: "*"  # public, stateless, read-only API: any origin (no cookies)
